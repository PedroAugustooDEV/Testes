<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        body {
            background-color: rgba(0, 0, 0, 0.831);
            font-family: Arial, Helvetica, sans-serif;
        }
        div {
            background-image: linear-gradient(to top, rgb(228, 7, 7), rgb(81, 3, 3) );
            width: 200px;
            height: 200px;
            border: solid 2px;
            border-radius: 50%;
            margin: auto;
        }
        div:hover {
            background-image: linear-gradient( to top, rgb(3, 3, 81), rgb(10, 10, 218));
            transition: 2s;
            transform: translatey(3em);
            
        }
    </style>
</head>
<body>
    <h1>
        Ball
    </h1>
    <div>

    </div>
</body>
</html>
